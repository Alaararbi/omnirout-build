name: Pull and Push OmniRoute Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Pull official image
        run: |
          docker pull diegosouzapw/omniroute:latest
      
      - name: Tag and push to your account
        run: |
          docker tag diegosouzapw/omniroute:latest ${{ secrets.DOCKERHUB_USERNAME }}/omniroute:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/omniroute:latest
